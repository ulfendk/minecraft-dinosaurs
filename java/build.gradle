plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// The mod version comes from package.json (or PACK_VERSION in CI) plus the Minecraft version, e.g. 0.5.0+26.3
def packageJson = new groovy.json.JsonSlurper().parse(file('../package.json'))
version = "${System.getenv('PACK_VERSION') ?: packageJson.version}+${project.minecraft_version}"
base { archivesName = 'prehistoric-dinosaurs-fabric' }

repositories {
	exclusiveContent {
		forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
		filter { includeGroup 'maven.modrinth' }
	}
}

loom {
	splitEnvironmentSourceSets()
}

sourceSets {
	// in-game screenshot test (Fabric client game test); not part of the released mod
	gametest {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output + sourceSets.client.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output + sourceSets.client.output
	}
}

loom {
	mods {
		dinosaurs {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		'dinosaurs-gametest' {
			sourceSet sourceSets.gametest
		}
	}
	runs {
		clientGameTest {
			client()
			name = 'Client Game Test'
			source sourceSets.gametest
			vmArg '-Dfabric.client.gametest'
			vmArg '-Dfabric.client.gametest.disableJoinScreenshot=true'
			runDir 'build/run/clientGameTest'
		}
	}
}

// Resources generated by the TypeScript pipeline (npm run build:java) are written here.
sourceSets.main.resources.srcDir 'src/generated/resources'

configurations {
	gametestCompileClasspath.extendsFrom clientCompileClasspath
	gametestRuntimeClasspath.extendsFrom clientRuntimeClasspath
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "maven.modrinth:geckolib:${project.geckolib_version}"
}

processResources {
	def version = project.version
	inputs.property 'version', version
	filesMatching('fabric.mod.json') { expand 'version': version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
